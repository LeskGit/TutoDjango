<html>
    <head>
        <title>Mon app DJANGO</title>
    </head>
    <body>
        <h1>Hello mes stats !</h1>
        <p>Mes stats sont :</p>
        <ul>
        {% for stat in stats %}
            <li>{{ stat.libelleStatus }} </li>
        {% endfor %}
        </ul>
        <p>J'ai {{ stats|length }} status préférés.</p>
        <p>
            J'ai
                {% if stats|length < 5 %}
                peu de 
                {% elif stats|length < 10 %}
                quelques
                {% else %}
                beaucoup de 
                {% endif %}
                status préférés
        </p>

    </body>
</html>
